[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-fleet-intelligence"
version = "1.1.0"
description = "A production-oriented multi-feed GBFS pipeline for fleet operations reporting."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]==3.3.5",
    "python-dotenv==1.2.3",
    "requests==2.34.2",
    "shapely==2.1.2",
]

[project.optional-dependencies]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.6",
]

[project.scripts]
fleet-ingest = "fleet_intelligence.main:main"
fleet-diagnostics = "fleet_intelligence.diagnostics:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fleet_intelligence = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["fleet_intelligence"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
files = ["src", "scripts"]
