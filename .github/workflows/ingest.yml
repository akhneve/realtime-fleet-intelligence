name: ingest-live-gbfs

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-gbfs-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install runtime
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m pip install --disable-pip-version-check --no-deps .

      - name: Ingest current snapshot
        run: fleet-ingest
        env:
          SYSTEM_INFORMATION_URL: ${{ secrets.SYSTEM_INFORMATION_URL }}
          STATION_INFORMATION_URL: ${{ secrets.STATION_INFORMATION_URL }}
          STATION_STATUS_URL: ${{ secrets.STATION_STATUS_URL }}
          FREE_BIKE_STATUS_URL: ${{ secrets.FREE_BIKE_STATUS_URL }}
          GBFS_URL: ${{ secrets.GBFS_URL }} # Legacy free-bike override.
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: require
          DETAIL_RETENTION_HOURS: "24"
          AGGREGATE_RETENTION_DAYS: "35"
          PIPELINE_RUN_RETENTION_DAYS: "90"
          REJECTED_RETENTION_DAYS: "14"
          FEED_STALE_MINUTES: "10"
          VOLUME_DROP_THRESHOLD: ${{ secrets.VOLUME_DROP_THRESHOLD }}
          VOLUME_DROP_POLICY: ${{ secrets.VOLUME_DROP_POLICY }}
          SEATTLE_BBOX_MIN_LAT: ${{ secrets.SEATTLE_BBOX_MIN_LAT }}
          SEATTLE_BBOX_MAX_LAT: ${{ secrets.SEATTLE_BBOX_MAX_LAT }}
          SEATTLE_BBOX_MIN_LON: ${{ secrets.SEATTLE_BBOX_MIN_LON }}
          SEATTLE_BBOX_MAX_LON: ${{ secrets.SEATTLE_BBOX_MAX_LON }}
          GRID_SIZE_DEGREES: ${{ secrets.GRID_SIZE_DEGREES }}
          REBALANCE_HIGH_THRESHOLD: ${{ secrets.REBALANCE_HIGH_THRESHOLD }}
          REBALANCE_MEDIUM_THRESHOLD: ${{ secrets.REBALANCE_MEDIUM_THRESHOLD }}
