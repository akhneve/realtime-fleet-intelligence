name: refresh-seattle-geography

on:
  schedule:
    # First day of every month at 09:17 UTC (01:17 PST / 02:17 PDT).
    - cron: "17 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seattle-geography-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install runtime
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m pip install --disable-pip-version-check --no-deps .

      - name: Refresh and verify Seattle geography
        run: python scripts/ingest_geography.py
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: require
          DB_CONNECT_TIMEOUT_SECONDS: "10"
          DB_STATEMENT_TIMEOUT_SECONDS: "120"
          GEOGRAPHY_GRID_SIZE_DEGREES: ${{ secrets.GEOGRAPHY_GRID_SIZE_DEGREES }}
          GRID_SIZE_DEGREES: ${{ secrets.GRID_SIZE_DEGREES }}
